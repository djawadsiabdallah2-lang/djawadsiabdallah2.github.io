<title>صفحتي الثانية</title>

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #101820;
        color: white;
        text-align: center;
    }

    .container {
        padding-top: 80px;
    }

    h1 {
        font-size: 42px;
        color: #00aaff;
        margin-bottom: 15px;
    }

    .card {
        width: 80%;
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        background: #182631;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .card h2 {
        color: #00aaff;
        font-size: 28px;
    }

    .card p {
        color: #dddddd;
        font-size: 18px;
        line-height: 1.8;
    }

    .emoji {
        font-size: 60px;
    }

    .button {
        display: inline-block;
        padding: 14px 30px;
        background: #00aaff;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-size: 18px;
        transition: 0.3s;
    }

    .button:hover {
        background: #0077cc;
        transform: scale(1.05);
    }

</style>
```

</head>

<body>

```
<div class="container">

    <h1>🎉 أهلاً بك في الصفحة الثانية!</h1>

    <div class="card">

        <div class="emoji">🚀</div>

        <h2>مشروعي الأول</h2>

        <p>
            أنا أتعلم الآن HTML و CSS وأقوم ببناء
            موقعي الأول باستخدام GitHub Pages.
        </p>

        <p>
            هذه مجرد البداية! 🔥
        </p>

    </div>

    <a href="index.html" class="button">
        ⬅️ العودة إلى الصفحة الرئيسية
    </a>

</div>
```

</body>

</html>
