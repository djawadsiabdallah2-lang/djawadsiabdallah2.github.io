<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تواصل معي | جواد</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .contact-hero {
            text-align: center;
            padding: 80px 20px 40px;
        }

        .contact-hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .contact-hero h1 span {
            color: #00d9ff;
        }

        .contact-hero p {
            color: #b8c4d0;
            font-size: 18px;
        }

        .contact-container {
            max-width: 800px;
            margin: 20px auto 80px;
            padding: 0 20px;
        }

        .contact-card {
            background: #18232e;
            border: 1px solid #263746;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .contact-card h2 {
            margin-top: 0;
            font-size: 28px;
        }

        .contact-card h2 span {
            color: #00d9ff;
        }

        .contact-card p {
            color: #aebbc7;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #34495e;
            border-radius: 10px;
            background: #101820;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            font-family: Arial, sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #00d9ff;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.15);
        }

        .form-group textarea {
            min-height: 160px;
            resize: vertical;
        }

        .send-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #00d9ff;
            color: #101820;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.25);
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #00d9ff;
            font-weight: bold;
        }

        /* الوضع الفاتح */
        body.light-mode .contact-hero p {
            color: #555;
        }

        body.light-mode .contact-card {
            background: white;
            border-color: #ddd;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body.light-mode .contact-card p {
            color: #666;
        }

        body.light-mode .form-group input,
        body.light-mode .form-group textarea {
            background: #f5f7fa;
            color: #222;
            border-color: #ccc;
        }

        body.light-mode .form-group input:focus,
        body.light-mode .form-group textarea:focus {
            border-color: #00a8c6;
        }
    </style>
</head>

<body>

    <!-- شريط التنقل -->
    <nav class="navbar">

        <div class="logo">
            جواد 🚀
        </div>

        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="about.html">عني</a>
            <a href="projects.html">مشاريعي</a>
            <a href="contact.html" class="active">تواصل معي</a>

            <button id="theme-button" class="theme-button">
                ☀️
            </button>
        </div>

    </nav>


    <!-- مقدمة الصفحة -->
    <section class="contact-hero">

        <h1>
            📩 تواصل <span>معي</span>
        </h1>

        <p>
            لديك فكرة أو تريد التواصل معي؟ أرسل لي رسالة 👇
        </p>

    </section>


    <!-- نموذج التواصل -->
    <main class="contact-container">

        <div class="contact-card">

            <h2>
                💬 أرسل <span>رسالة</span>
            </h2>

            <p>
                املأ المعلومات التالية وسأحصل على رسالتك.
            </p>


            <form id="contact-form">

                <div class="form-group">
                    <label for="name">👤 الاسم</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="اكتب اسمك"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">📧 البريد الإلكتروني</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="message">✏️ الرسالة</label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="اكتب رسالتك هنا..."
                        required
                    ></textarea>
                </div>


                <button
                    type="submit"
                    class="send-button"
                    id="send-button"
                >
                    🚀 إرسال الرسالة
                </button>

            </form>


            <div id="loading">
                ⏳ جارٍ إرسال الرسالة...
            </div>

        </div>

    </main>


    <!-- التذييل -->
    <footer>

        <p>
            © 2026 جواد — جميع الحقوق محفوظة 🚀
        </p>

        <p>
            تم التطوير باستخدام ❤️ و HTML و CSS
        </p>

    </footer>


    <script>

        /* =========================
           الوضع الليلي / الفاتح
        ========================= */

        const themeButton = document.getElementById("theme-button");

        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "light") {

            document.body.classList.add("light-mode");
            themeButton.textContent = "🌙";

        }


        themeButton.addEventListener("click", function () {

            document.body.classList.toggle("light-mode");

            if (document.body.classList.contains("light-mode")) {

                themeButton.textContent = "🌙";
                localStorage.setItem("theme", "light");

            } else {

                themeButton.textContent = "☀️";
                localStorage.setItem("theme", "dark");

            }

        });


        /* =========================
           إرسال النموذج
        ========================= */

        const form = document.getElementById("contact-form");
        const loading = document.getElementById("loading");
        const sendButton = document.getElementById("send-button");


        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            loading.style.display = "block";
            sendButton.disabled = true;
            sendButton.textContent = "⏳ جارٍ الإرسال...";


            const formData = new FormData(form);


            try {

                const response = await fetch(
                    "https://formspree.io/f/xdeodwnq",
                    {
                        method: "POST",
                        body: formData,
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );


                if (response.ok) {

                    window.location.href = "success.html";

                } else {

                    loading.style.display = "none";
                    sendButton.disabled = false;
                    sendButton.textContent = "🚀 إرسال الرسالة";

                    alert("❌ حدث خطأ أثناء إرسال الرسالة.");

                }

            } catch (error) {

                loading.style.display = "none";
                sendButton.disabled = false;
                sendButton.textContent = "🚀 إرسال الرسالة";

                alert("❌ تعذر إرسال الرسالة. تحقق من اتصال الإنترنت.");

            }

        });

    </script>

</body>

</html>
