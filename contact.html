<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تواصل معي</title>

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #101820;
        color: white;
        text-align: center;
    }

    .container {
        padding: 60px 20px;
    }

    h1 {
        font-size: 45px;
        color: #00aaff;
        margin-bottom: 15px;
    }

    .subtitle {
        color: #bbbbbb;
        font-size: 20px;
        margin-bottom: 40px;
    }

    .contact-card {
        width: 80%;
        max-width: 600px;
        margin: auto;
        padding: 35px;
        background: #182631;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .icon {
        font-size: 70px;
        margin-bottom: 10px;
    }

    .contact-card h2 {
        color: #00aaff;
        margin-bottom: 30px;
    }

    .form-group {
        text-align: right;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #dddddd;
        font-size: 17px;
    }

    input,
    textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: #101820;
        color: white;
        font-size: 16px;
        outline: none;
    }

    input:focus,
    textarea:focus {
        box-shadow: 0 0 0 2px #00aaff;
    }

    textarea {
        height: 150px;
        resize: vertical;
    }

    .send-button {
        width: 100%;
        padding: 14px;
        border: none;
        background: #00aaff;
        color: white;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
    }

    .send-button:hover {
        background: #0077cc;
        transform: scale(1.02);
    }

    .buttons {
        margin-top: 40px;
    }

    .button {
        display: inline-block;
        margin: 8px;
        padding: 14px 30px;
        background: #00aaff;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-size: 18px;
        transition: 0.3s;
    }

    .button:hover {
        background: #0077cc;
        transform: scale(1.05);
    }

</style>
```

</head>

<body>

```
<div class="container">

    <h1>📩 تواصل معي</h1>

    <p class="subtitle">
        إذا أردت التواصل معي، يمكنك استخدام النموذج التالي 👇
    </p>


    <div class="contact-card">

        <div class="icon">💬</div>

        <h2>أرسل رسالة</h2>


        <form>

            <div class="form-group">

                <label for="name">
                    الاسم
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="اكتب اسمك"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="message">
                    الرسالة
                </label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="اكتب رسالتك هنا..."
                    required
                ></textarea>

            </div>


            <button type="submit" class="send-button">
                📤 إرسال الرسالة
            </button>

        </form>

    </div>


    <div class="buttons">

        <a href="index.html" class="button">
            🏠 الرئيسية
        </a>

        <a href="projects.html" class="button">
            🚀 مشاريعي
        </a>

    </div>

</div>
```

</body>

</html>
