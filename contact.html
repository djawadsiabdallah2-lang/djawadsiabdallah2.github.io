
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تواصل معي</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
            text-align: center;
        }

        .container {
            padding: 60px 20px;
        }

        h1 {
            font-size: 45px;
            color: #00aaff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #bbbbbb;
            font-size: 20px;
            margin-bottom: 40px;
        }

        .contact-card {
            width: 90%;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            background: #182631;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #00aaff;
            font-size: 18px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #101820;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus,
        textarea:focus {
            box-shadow: 0 0 0 2px #00aaff;
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 14px 30px;
            background: #00aaff;
            color: white;
            border: none;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .button:hover {
            background: #0077cc;
            transform: scale(1.05);
        }

        .buttons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .loading {
            display: none;
            margin-top: 15px;
            color: #00aaff;
            font-size: 17px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>📩 تواصل معي</h1>

        <p class="subtitle">
            يمكنك إرسال رسالة لي من خلال النموذج التالي 🚀
        </p>

        <div class="contact-card">

            <form id="contact-form">

                <div class="form-group">

                    <label for="name">
                        الاسم
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="اكتب اسمك"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="message">
                        الرسالة
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="اكتب رسالتك هنا..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="button"
                >
                    📤 إرسال الرسالة
                </button>

                <div id="loading" class="loading">
                    ⏳ جاري إرسال الرسالة...
                </div>

            </form>

        </div>


        <div class="buttons">

            <a href="index.html" class="button">
                🏠 الرئيسية
            </a>

            <a href="projects.html" class="button">
                🚀 مشاريعي
            </a>

        </div>

    </div>


    <script>

        const form = document.getElementById("contact-form");
        const loading = document.getElementById("loading");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            loading.style.display = "block";

            const formData = new FormData(form);

            try {

                const response = await fetch(
                    "https://formspree.io/f/xdeodwnq",
                    {
                        method: "POST",
                        body: formData,
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                if (response.ok) {

                    window.location.href = "success.html";

                } else {

                    loading.style.display = "none";

                    alert("❌ حدث خطأ أثناء إرسال الرسالة.");

                }

            } catch (error) {

                loading.style.display = "none";

                alert("❌ تعذر إرسال الرسالة. تحقق من اتصال الإنترنت.");

            }

        });

    </script>

</body>

</html>
