<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مشاريعي</title>

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #101820;
        color: white;
        text-align: center;
    }

    .container {
        padding: 60px 20px;
    }

    h1 {
        font-size: 42px;
        color: #00aaff;
        margin-bottom: 50px;
    }

    .projects {
        display: flex;
        justify-content: center;
        gap: 25px;
        flex-wrap: wrap;
    }

    .card {
        width: 280px;
        padding: 25px;
        background: #182631;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-10px);
    }

    .icon {
        font-size: 60px;
    }

    .card h2 {
        color: #00aaff;
    }

    .card p {
        color: #dddddd;
        line-height: 1.7;
    }

    .button {
        display: inline-block;
        margin-top: 40px;
        padding: 14px 30px;
        background: #00aaff;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-size: 18px;
        transition: 0.3s;
    }

    .button:hover {
        background: #0077cc;
        transform: scale(1.05);
    }

</style>
```

</head>

<body>

```
<div class="container">

    <h1>🚀 مشاريعي</h1>

    <div class="projects">

        <div class="card">

            <div class="icon">🌐</div>

            <h2>موقعي الأول</h2>

            <p>
                أول موقع أقوم بإنشائه باستخدام
                HTML و CSS و GitHub Pages.
            </p>

        </div>

        <div class="card">

            <div class="icon">🎮</div>

            <h2>مشروع لعبة</h2>

            <p>
                مشروع لعبة أعمل عليه وأطوره
                وأضيف إليه العديد من الأفكار.
            </p>

        </div>

        <div class="card">

            <div class="icon">💡</div>

            <h2>مشروع قادم</h2>

            <p>
                هنا سأضع أحد مشاريعي القادمة
                عندما أنتهي منه.
            </p>

        </div>

    </div>

    <a href="index.html" class="button">
        ⬅️ العودة إلى الرئيسية
    </a>

</div>
```

</body>

</html>
