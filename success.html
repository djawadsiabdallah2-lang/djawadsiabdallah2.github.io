<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تم الإرسال</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
            text-align: center;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            width: 90%;
            max-width: 600px;
            padding: 50px 30px;
            background: #182631;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 90px;
            margin-bottom: 20px;
        }

        h1 {
            color: #00aaff;
            font-size: 38px;
            margin-bottom: 20px;
        }

        p {
            color: #dddddd;
            font-size: 20px;
            line-height: 1.8;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 30px;
            background: #00aaff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            transition: 0.3s;
        }

        .button:hover {
            background: #0077cc;
            transform: scale(1.05);
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <div class="icon">✅</div>

            <h1>تم إرسال رسالتك بنجاح!</h1>

            <p>
                شكرًا لتواصلك معي 💙
                <br>
                تم استلام رسالتك وسأطلع عليها قريبًا.
            </p>

            <a href="index.html" class="button">
                🏠 العودة إلى الرئيسية
            </a>

        </div>

    </div>

</body>

</html>
