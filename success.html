<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تم الإرسال | جواد</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .success-container {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .success-card {
            max-width: 650px;
            width: 100%;
            text-align: center;
            background: #18232e;
            border: 1px solid #263746;
            border-radius: 24px;
            padding: 50px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: successAppear 0.7s ease;
        }

        @keyframes successAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .success-card h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .success-card h1 span {
            color: #00d9ff;
        }

        .success-card p {
            color: #b8c4d0;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .success-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .success-button {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 10px;
            background: #00d9ff;
            color: #101820;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .success-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.25);
        }

        .success-button.secondary {
            background: transparent;
            color: #00d9ff;
            border: 1px solid #00d9ff;
        }

        body.light-mode .success-card {
            background: white;
            border-color: #ddd;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        body.light-mode .success-card p {
            color: #666;
        }

        body.light-mode .success-button.secondary {
            color: #008eaa;
            border-color: #008eaa;
        }

        @media (max-width: 600px) {

            .success-card {
                padding: 40px 20px;
            }

            .success-card h1 {
                font-size: 28px;
            }

            .success-card p {
                font-size: 16px;
            }

            .success-icon {
                font-size: 65px;
            }

            .success-buttons {
                flex-direction: column;
            }

            .success-button {
                width: auto;
            }
        }
    </style>
</head>

<body>

    <!-- شريط التنقل -->
    <nav class="navbar">

        <div class="logo">
            جواد 🚀
        </div>

        <div class="nav-links">

            <a href="index.html">الرئيسية</a>

            <a href="about.html">عني</a>

            <a href="projects.html">مشاريعي</a>

            <a href="contact.html">تواصل معي</a>

            <button id="theme-button" class="theme-button">
                ☀️
            </button>

        </div>

    </nav>


    <!-- رسالة النجاح -->
    <main class="success-container">

        <div class="success-card">

            <div class="success-icon">
                ✅
            </div>

            <h1>
                تم إرسال <span>رسالتك بنجاح!</span>
            </h1>

            <p>
                شكرًا لتواصلك معي 💙
                <br>
                تم استلام رسالتك وسأطلع عليها قريبًا.
            </p>

            <div class="success-buttons">

                <a href="index.html" class="success-button">
                    🏠 العودة للرئيسية
                </a>

                <a href="projects.html" class="success-button secondary">
                    🎮 مشاهدة مشاريعي
                </a>

            </div>

        </div>

    </main>


    <!-- التذييل -->
    <footer>

        <p>
            © 2026 جواد — جميع الحقوق محفوظة 🚀
        </p>

        <p>
            تم التطوير باستخدام ❤️ و HTML و CSS
        </p>

    </footer>


    <!-- الوضع الليلي -->
    <script>

        const themeButton = document.getElementById("theme-button");

        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "light") {

            document.body.classList.add("light-mode");

            themeButton.textContent = "🌙";

        }


        themeButton.addEventListener("click", function () {

            document.body.classList.toggle("light-mode");

            if (document.body.classList.contains("light-mode")) {

                themeButton.textContent = "🌙";

                localStorage.setItem("theme", "light");

            } else {

                themeButton.textContent = "☀️";

                localStorage.setItem("theme", "dark");

            }

        });

    </script>

</body>

</html>
