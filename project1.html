    body {

    .container {
        padding-top: 80px;
    }

    h1 {
        font-size: 42px;
        color: #00aaff;
    }

    .card {
        width: 80%;
        max-width: 600px;
        margin: 40px auto;
        padding: 35px;
        background: #182631;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .icon {
        font-size: 80px;
    }

    p {
        color: #dddddd;
        font-size: 19px;
        line-height: 1.8;
    }

    .button {
        display: inline-block;
        margin-top: 20px;
        padding: 14px 30px;
        background: #00aaff;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-size: 18px;
        transition: 0.3s;
    }

    .button:hover {
        background: #0077cc;
        transform: scale(1.05);
    }

</style>
