<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة الإدارة</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: #1b263b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 170, 255, 0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #00aaff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0088cc;
        }

        #message {
            margin-top: 15px;
            color: #ff6b6b;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-box" id="loginBox">

        <h1>🔐 لوحة الإدارة</h1>

        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
        >

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
        >

        <button id="loginButton">
            تسجيل الدخول
        </button>

        <p id="message"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // =========================
        // بيانات Supabase
        // =========================

        const SUPABASE_URL = "ضع_رابط_مشروعك_هنا";

        const SUPABASE_ANON_KEY = "ضع_anon_key_هنا";


        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        // =========================
        // تسجيل الدخول
        // =========================

        document
            .getElementById("loginButton")
            .addEventListener("click", async () => {

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");


                if (!email || !password) {

                    message.textContent =
                        "⚠️ أدخل البريد وكلمة المرور";

                    return;
                }


                message.textContent =
                    "⏳ جاري تسجيل الدخول...";


                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {

                    console.error(error);

                    message.textContent =
                        "❌ البريد أو كلمة المرور غير صحيحة";

                    return;
                }


                // تسجيل الدخول نجح
                window.location.href = "admin-dashboard.html";

            });

    </script>

</body>

</html>
